name: Update Metrics

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Generate and save metrics
        run: ruby lib/capture_log_entries.rb

      - name: Create Pull Request with new metrics
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          commit-message: "Added new metrics"
          title: "Automated update: new metrics"
          body: "This PR was created automatically by the Update Metrics workflow."
          branch: auto/update-metrics-${{ github.run_id }}
          base: main
          add-paths: |
            lib/team_metrics.json

      - name: Enable auto-merge for PR
        if: steps.cpr.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ github.token }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash

  build:
    needs: update-schedule
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build passed!"
